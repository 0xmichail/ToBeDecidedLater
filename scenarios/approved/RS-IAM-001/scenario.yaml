family: credential_compromise
title: Compromise of privileged credentials

threat:
  actor_types:
    - external
    - internal
  intent_context:
    - unauthorized access
    - privilege abuse
  capability_context: Ability to obtain, guess, reuse, or abuse legitimate credentials.

