  attack_flow_reference: null
  narrative: >-
    A threat actor obtains or guesses legitimate credentials and uses the resulting
    valid account access to reach security-significant functions of the assessed service.

adverse_event: >-
  Unauthorized privileged access is obtained and used to perform actions against the
  assessed service under the identity of a legitimate account.

consequences:
  confidentiality: Sensitive information may be accessed or disclosed without authorization.
  integrity: Data, configuration, access rights, or transactions may be modified without authorization.
  availability: Privileged actions may disrupt the service or prevent legitimate administrative access.
  operational: Investigation, containment, credential recovery, and service restoration may interrupt operations.
  customer: Customer accounts, data, transactions, or service availability may be affected depending on scope.
  regulatory: Reporting or other legal obligations may arise depending on the affected data, service, and jurisdiction.

cia_impact:
  calibration: cia-0-3-v0.1
  confidentiality:
    weight: 3
    rationale: >-
      Privileged account access can directly expose sensitive information across the
      services and resources available to the compromised identity.
  integrity:
    weight: 3
    rationale: >-
      Privileged account access can directly enable unauthorized changes to data,
      configuration, permissions, and security-relevant transactions.
  availability:
    weight: 2
    rationale: >-
      Privileged actions can materially disrupt services or administrative access,
      although disruption is not required for this scenario to succeed.
  contextual_note: >-
    These are inherent scenario-level weights. An assessment must recalibrate them
    using the affected asset, information, business service, and operating context.

scenario_statement: >-
  A threat actor compromises or guesses legitimate privileged credentials and uses the
  resulting valid account access to perform unauthorized actions against the assessed
  service, potentially causing unauthorized disclosure, modification, or disruption of
  information and services.

